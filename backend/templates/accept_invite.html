{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-body">
      <h5 class="mb-3">Accept invitation</h5>
      <form method="post">
        <div class="mb-2">
          <label>Invite token</label>
          <input class="form-control" type="text" name="token" value="{{ token }}" required>
        </div>
        <div class="mb-3">
          <label>Your email</label>
          <input class="form-control" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <button class="btn btn-success">Accept</button>
        <a class="btn btn-link" href="{{ url_for('web_login') }}">Login</a>
        <a class="btn btn-link" href="{{ url_for('web_register') }}">Register</a>
      </form>
      <div class="small text-muted mt-2">If you don't have an account, register first.</div>
    </div>
  </div>
</div>
{% endblock %}
